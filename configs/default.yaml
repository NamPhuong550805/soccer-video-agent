perception:
  n_frames_default: 8            # frame moi clip, moi he dung chung
  n_frames_total_multiview: 24   # cau nhieu clip (q9, q14): chia deu cho cac clip
  image_size: 336

matching:            # q9, chon tren dev (04_dev_tuning.py q9)
  encoder: clip_vit_l       # > SigLIP, DINOv2, HSV
  n_frames: 24              # moi clip; frame chi vao encoder anh, khong vao VLM (4 -> 61, 12 -> 78, 24 -> 81)
  square: false             # bo vien den khong giup
  lam: 0.0                  # phat dao thu tu thoi gian lam giam accuracy o moi encoder
  temperature: 0.01         # theo NLL tren dev

multiview:           # q14, chon tren dev (04_dev_tuning.py q14)
  fusion: log_pool          # hoi rieng tung goc roi gop: dev 63.1 vs B0 52.4, bo phieu 60.7
  quality: false            # VLM tu danh gia do ro gan nhu hang so (0.78 +- 0.06), khong doi ket qua
  ordinal: false            # gop theo thang keo ve phuong an giua (offence: 0%), the phat chi hon 1 cau
  with_holistic: false      # them B0 (ca mau 1 prompt) lam giam: 63.1 -> 57.1

branch_a:            # q10, q11, chon tren dev (04_dev_tuning.py branch_a)
  with_holistic: []         # them B0 khong giup: q10 88.0 -> 88.7 (2 cau), q11 75.7 -> 72.3

branch_b:            # q8, q13
  edge_frames: 3            # so frame dau / cuoi clip cho kenh camera cua q8 (chon tren dev: 2/3/4)

reasoner:
  theta_fallback: 0.15   # do tin duoi nguong nay thi Reasoner hoi them
  max_steps: 3           # so hanh dong toi da moi mau
  no_vlm_actions: [q9, q10, q11, q14]   # dev: co cong cu chuyen dung thi hoi them VLM khong giup hoac lam giam
  policy: rule           # rule | llm (LLM tu chon buoc tiep theo); chon tren dev (07_agent.py policy)

agent:               # SVA-Agent cho video va cau hoi that (src/sva/agent.py)
  abstain_below: 0.527      # xac suat cao nhat duoi nguong nay thi tu choi; chon tren dev de cau tra loi dung >= 85%
                            # (07_agent.py abstain: dev tra loi 64,8% cau, dung 85,2%; test 65,5% / 82,5%)
  route_margin: 0.2         # LLM dinh tuyen kem chac hon muc nay thi hoi lai nguoi dung

b1:                  # tai hien SoccerAgent
  exec_tokens: 384          # moi luot cua bo thuc thi (<Call>); q9 chep 5 duong dan nen can dai
  answer_tokens: 256        # buoc LLM cuoi
  prompt_lookup: 10         # so token doan truoc tu prompt khi bo thuc thi sinh lenh
  vlm_tokens: 128           # nhu tool VLM goc
  commentary_tokens: 64
  camera_max_frames: 4      # 2 lan Camera Detection -> toi da 8 frame, bang B0

split:
  dev_ratio: 0.3
  seed: 42
