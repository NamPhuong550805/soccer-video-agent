[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sva"
version = "0.1.0"
description = "SVA — Soccer Video Agent: hệ đa tác tử training-free cho 6 tác vụ video của SoccerBench"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "opencv-python>=4.9",
    "pillow",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=5.0",
    "accelerate>=0.27",
    "bitsandbytes",
    "open_clip_torch>=2.24",
    "scipy>=1.11",
    "scenedetect>=0.6",
    "einops",            # Action Classifier cua UniSoccer (code goc)
    "timm",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib", "jupyter"]
api = ["google-genai>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
